name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Valores só para o CI (banco descartável). Não são segredos.
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Aplica as migrations no banco de testes
        run: npm run db:deploy
      - name: Testes unitários + e2e com cobertura mínima
        run: npm run test:cov
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Imagem Docker e teste de fumaça
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sobe a stack completa (API, banco, migrations, Prometheus, Grafana)
        run: docker compose up -d --build --wait api prometheus grafana
      - name: Teste de fumaça
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health/ready
          curl -fsS http://localhost:3000/docs-json | grep -q '"Booking API"'
          curl -fsS http://localhost:3000/metrics | grep -q http_request_duration_seconds
          docker compose --profile seed run --rm seed
          TOKEN=$(curl -fsS -X POST http://localhost:3000/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"admin-senha-123"}' | jq -r .accessToken)
          curl -fsS http://localhost:3000/resources -H "authorization: Bearer $TOKEN" | jq -e '.meta.total >= 1'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Desmonta
        if: always()
        run: docker compose down -v

  publish:
    name: Publica a imagem no GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
